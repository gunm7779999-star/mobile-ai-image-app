@tailwind base;
@tailwind components;
@tailwind utilities;

:root {
  color-scheme: light;
  --safe-bottom: env(safe-area-inset-bottom);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #f8fafc;
}

body {
  min-height: 100%;
  margin: 0;
  background:
    radial-gradient(circle at 15% 8%, rgba(129, 140, 248, 0.22), transparent 28%),
    radial-gradient(circle at 86% 10%, rgba(244, 114, 182, 0.20), transparent 24%),
    linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
  color: #0f172a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

button, input, textarea, select {
  font: inherit;
}

textarea {
  resize: none;
}

.phone-frame {
  min-height: 100dvh;
  padding-bottom: calc(24px + var(--safe-bottom));
}

.generated-card {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.88), rgba(255,255,255,0.58)),
    radial-gradient(circle at 25% 15%, rgba(59, 130, 246, 0.35), transparent 25%),
    radial-gradient(circle at 78% 10%, rgba(236, 72, 153, 0.33), transparent 28%),
    radial-gradient(circle at 54% 82%, rgba(14, 165, 233, 0.27), transparent 34%);
}
