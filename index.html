<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>モバイルAI画像アプリ</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="badge">MVP / Demo</div>
      <h1>モバイルAI画像アプリ</h1>
      <p>スマホで使いやすい、AI画像生成アプリ風のMVPです。現在はAPI未接続のため、生成ボタンでダミーカードを表示します。</p>
    </section>

    <section class="panel">
      <label class="field">
        <span>作りたい画像の説明</span>
        <textarea id="prompt" rows="5" placeholder="例：夜の東京、ネオン、近未来的なAIロボット、映画ポスター風"></textarea>
      </label>

      <div class="grid">
        <label class="field">
          <span>スタイル</span>
          <select id="style">
            <option>リアル</option>
            <option>アニメ</option>
            <option>水彩</option>
            <option>3Dレンダー</option>
            <option>インフォグラフィック</option>
          </select>
        </label>
        <label class="field">
          <span>サイズ</span>
          <select id="size">
            <option>1024 × 1024</option>
            <option>縦長 1024 × 1536</option>
            <option>横長 1536 × 1024</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>枚数</span>
        <input id="count" type="range" min="1" max="4" value="2" />
        <output id="countOut">2枚</output>
      </label>

      <button id="generate" class="primary">画像を生成する</button>
    </section>

    <section class="results" aria-live="polite">
      <div class="section-title">
        <h2>生成結果</h2>
        <span id="status">未生成</span>
      </div>
      <div id="cards" class="cards empty">ここに生成結果が表示されます</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
