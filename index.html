<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="スマホから使えるAI画像生成アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MIRA Image Lab</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-copy">
        <span>MIRA</span>
        <strong>Image Lab</strong>
      </div>
      <div class="api-badge"><i></i> API READY</div>
    </header>

    <section class="intro">
      <p class="eyebrow">CREATE SOMETHING NEW</p>
      <h1>想像を、<br><em>画像にしよう。</em></h1>
      <p>イメージを言葉にして、スタイルを選ぶだけ。AIがあなたのアイデアを形にします。</p>
    </section>

    <form id="generatorForm" class="panel" novalidate>
      <label class="field prompt-field">
        <span>作りたい画像の説明</span>
        <textarea id="prompt" name="prompt" rows="5" maxlength="2000" placeholder="例：雨上がりの東京、ネオンが水たまりに反射する静かな路地" required></textarea>
        <small><button id="examplePrompt" type="button">例文を使う</button><output id="promptCount">0 / 2000</output></small>
      </label>

      <div class="field">
        <span>画像スタイル</span>
        <div class="choices style-choices" role="radiogroup" aria-label="画像スタイル">
          <button type="button" class="choice active" data-group="style" data-value="写真" aria-pressed="true">写真</button>
          <button type="button" class="choice" data-group="style" data-value="イラスト" aria-pressed="false">イラスト</button>
          <button type="button" class="choice" data-group="style" data-value="アニメ" aria-pressed="false">アニメ</button>
          <button type="button" class="choice" data-group="style" data-value="3Dレンダー" aria-pressed="false">3D</button>
        </div>
      </div>

      <div class="field">
        <span>画像サイズ</span>
        <div class="choices" role="radiogroup" aria-label="画像サイズ">
          <button type="button" class="choice active" data-group="size" data-value="1024x1024" aria-pressed="true">正方形</button>
          <button type="button" class="choice" data-group="size" data-value="1024x1536" aria-pressed="false">縦長</button>
          <button type="button" class="choice" data-group="size" data-value="1536x1024" aria-pressed="false">横長</button>
        </div>
      </div>

      <div class="field">
        <span>生成枚数</span>
        <div class="choices" role="radiogroup" aria-label="生成枚数">
          <button type="button" class="choice active" data-group="count" data-value="1" aria-pressed="true">1枚</button>
          <button type="button" class="choice" data-group="count" data-value="2" aria-pressed="false">2枚</button>
          <button type="button" class="choice" data-group="count" data-value="4" aria-pressed="false">4枚</button>
        </div>
      </div>

      <p id="formError" class="error" role="alert" hidden></p>
      <button id="generateButton" class="primary" type="submit"><span>✦</span>画像を生成する</button>
      <p class="cost-note">画像生成にはOpenAI APIの利用料金が発生します。</p>
    </form>

    <section id="results" class="results" aria-labelledby="resultsTitle" aria-live="polite">
      <div class="section-title">
        <div><p>YOUR CREATIONS</p><h2 id="resultsTitle">生成結果</h2></div>
        <span id="status">未生成</span>
      </div>
      <div id="cards" class="cards empty">
        <div class="empty-icon" aria-hidden="true">✦</div>
        <strong>まだ画像はありません</strong>
        <p>説明と設定を入力して、最初の画像を生成してみましょう。</p>
      </div>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
